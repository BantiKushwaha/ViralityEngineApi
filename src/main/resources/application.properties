spring.application.name=ViralityEngineApi

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/virality_engine
spring.datasource.username=virality_user
spring.datasource.password=virality_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.data-source-properties.options=-c TimeZone=Asia/Kolkata

# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Server Configuration
server.port=8080
